<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TP03 - Exercice 4 - Cibles et particules</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>
    AFRAME.registerComponent('deplacement-joystick', {
      init: function () {
        this.gauche = document.querySelector('#mainGauche');
        this.droite = document.querySelector('#mainDroite');
        this.camera = document.querySelector('#camera');
        this.deplacement = {x: 0, y: 0};
        this.rotation = 0;

        this.gauche.addEventListener('thumbstickmoved', e => {
          this.deplacement.x = e.detail.x;
          this.deplacement.y = e.detail.y;
        });

        this.droite.addEventListener('thumbstickmoved', e => {
          this.rotation = e.detail.x;
        });
      },

      tick: function (t, dt) {
        let vitesse = dt / 1000;
        let angle = this.camera.object3D.rotation.y + this.el.object3D.rotation.y;

        this.el.object3D.rotation.y -= this.rotation * vitesse;

        this.el.object3D.position.x +=
          (-Math.sin(angle) * -this.deplacement.y +
           Math.cos(angle) * this.deplacement.x) * vitesse * 3;

        this.el.object3D.position.z +=
          (-Math.cos(angle) * -this.deplacement.y -
           Math.sin(angle) * this.deplacement.x) * vitesse * 3;
      }
    });


    AFRAME.registerComponent('saisie-objet', {
      init: function () {
        this.objet = null;

        this.el.addEventListener('gripdown', () => {
          let objets = document.querySelectorAll('.saisissable');
          let main = new THREE.Vector3();

          this.el.object3D.getWorldPosition(main);

          let distance = 0.3;

          objets.forEach(objet => {
            let position = new THREE.Vector3();
            objet.object3D.getWorldPosition(position);

            let d = main.distanceTo(position);

            if (d < distance) {
              distance = d;
              this.objet = objet;
            }
          });

          if (this.objet) {
            this.objet.removeAttribute('dynamic-body');
            this.el.object3D.attach(this.objet.object3D);
          }
        });

        this.el.addEventListener('gripup', () => {
          if (!this.objet) return;

          let objet = this.objet;

          this.el.sceneEl.object3D.attach(objet.object3D);
          objet.setAttribute('dynamic-body', 'mass: 1');

          this.objet = null;
        });
      }
    });


    AFRAME.registerComponent('tir-arme', {
      schema: {
        vitesseProjectile: {default: 12},
        rayonProjectile: {default: 0.05},
        masseProjectile: {default: 0.2}
      },

      init: function () {
        var contexte = this;

        this.el.addEventListener('triggerdown', function () {
          contexte.tirer();
        });
      },

      tirer: function () {
        var saisie = this.el.components['saisie-objet'];

        if (!saisie || !saisie.objetSaisi) return;
        if (!saisie.objetSaisi.classList.contains('arme')) return;

        var arme = saisie.objetSaisi;
        var bouche = arme.querySelector('.bouche');

        var position = new THREE.Vector3();
        var quaternion = new THREE.Quaternion();

        bouche.object3D.getWorldPosition(position);
        bouche.object3D.getWorldQuaternion(quaternion);

        var direction = new THREE.Vector3(0, 0, -1)
          .applyQuaternion(quaternion)
          .normalize();

        var projectile = document.createElement('a-sphere');

        projectile.setAttribute('radius', this.data.rayonProjectile);
        projectile.setAttribute('color', '#FFD43B');

        projectile.setAttribute('position', {
          x: position.x + direction.x * 0.2,
          y: position.y + direction.y * 0.2,
          z: position.z + direction.z * 0.2
        });

        projectile.setAttribute(
          'dynamic-body',
          'shape: sphere; mass: ' + this.data.masseProjectile
        );

        this.el.sceneEl.appendChild(projectile);

        var puissance = this.data.vitesseProjectile;

        function appliquerVitesse() {
          if (!projectile.body) return;

          projectile.body.velocity.set(
            direction.x * puissance,
            direction.y * puissance,
            direction.z * puissance
          );
        }

        projectile.addEventListener('body-loaded', appliquerVitesse);

        setTimeout(function () {
          appliquerVitesse();
        }, 50);
      }
    });


    AFRAME.registerComponent('generateur-cibles', {
      schema: {
        delai: {default: 3000}
      },

      init: function () {
        this.generer();

        this.timer = setInterval(() => {
          this.generer();
        }, this.data.delai);
      },

      remove: function () {
        clearInterval(this.timer);
      },

      generer: function () {
        let cible;

        if (Math.random() < 0.5) {
          cible = document.createElement('a-box');

          cible.setAttribute('width', '0.4');
          cible.setAttribute('height', '0.4');
          cible.setAttribute('depth', '0.4');
          cible.setAttribute('color', '#FA5252');
        } else {
          cible = document.createElement('a-cone');

          cible.setAttribute('radius-bottom', '0.25');
          cible.setAttribute('radius-top', '0');
          cible.setAttribute('height', '0.5');
          cible.setAttribute('color', '#BE4BDB');
        }

        cible.classList.add('cible');

        cible.setAttribute('position', {
          x: (Math.random() - 0.5) * 8,
          y: 1.5,
          z: -2 - Math.random() * 8
        });

        cible.setAttribute(
          'static-body',
          'shape: box'
        );

        cible.setAttribute(
          'shadow',
          'cast: true; receive: true'
        );

        this.el.appendChild(cible);
      }
    });


    function jouerSonImpact(scene, position) {
      let son = document.createElement('a-entity');

      son.setAttribute('position', position);

      son.setAttribute(
        'sound',
        'src: #sonImpact; positional: true; distanceModel: linear; refDistance: 1; maxDistance: 25; rolloffFactor: 1; volume: 1'
      );

      scene.appendChild(son);

      son.addEventListener('loaded', () => {
        son.components.sound.playSound();
      });

      setTimeout(() => {
        son.remove();
      }, 1000);
    }


    function creerParticules(scene, position) {
      for (let i = 0; i < 12; i++) {

        let particule = document.createElement('a-sphere');

        particule.setAttribute('radius', '0.04');
        particule.setAttribute('color', '#FFA94D');
        particule.setAttribute(
          'material',
          'transparent: true; opacity: 1'
        );

        particule.setAttribute('position', position);

        let destination = {
          x: position.x + (Math.random() - 0.5),
          y: position.y + (Math.random() - 0.5),
          z: position.z + (Math.random() - 0.5)
        };

        particule.setAttribute(
          'animation__deplacement',
          'property: position; to: ' +
          destination.x + ' ' +
          destination.y + ' ' +
          destination.z +
          '; dur: 600; easing: easeOutQuad'
        );

        particule.setAttribute(
          'animation__disparition',
          'property: material.opacity; from: 1; to: 0; dur: 600; easing: easeOutQuad'
        );

        scene.appendChild(particule);

        setTimeout(() => {
          particule.remove();
        }, 650);
      }
    }
  </script>
</head>

      class="saisissable arme"
      position="0.3 1.1 -1"
      shadow="cast: true"

        width="0.07"
        height="0.12"
