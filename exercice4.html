<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TP03 - Exercice 4 - Cibles et particules</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.2/dist/aframe-physics-system.min.js"></script>
  <script>
    AFRAME.registerComponent('deplacement-joystick', {
      schema: {
        vitesseDeplacement: {default: 3},
        vitesseRotation: {default: 70}
      },
      init: function () {
        this.axeDeplacement = {x: 0, y: 0};
        this.axeRotation = 0;
        this.camera = document.querySelector('#camera');
        var mainGauche = document.querySelector('#mainGauche');
        var mainDroite = document.querySelector('#mainDroite');
        var contexte = this;
        mainGauche.addEventListener('thumbstickmoved', function (evenement) {
          contexte.axeDeplacement.x = evenement.detail.x;
          contexte.axeDeplacement.y = evenement.detail.y;
        });
        mainDroite.addEventListener('thumbstickmoved', function (evenement) {
          contexte.axeRotation = evenement.detail.x;
        });
      },
      tick: function (temps, deltaTemps) {
        var secondes = deltaTemps / 1000;
        var rig = this.el.object3D;
        if (Math.abs(this.axeRotation) > 0.15) {
          rig.rotation.y -= THREE.MathUtils.degToRad(this.data.vitesseRotation) * this.axeRotation * secondes;
        }
        if (Math.abs(this.axeDeplacement.x) > 0.15 || Math.abs(this.axeDeplacement.y) > 0.15) {
          var orientation = this.camera.object3D.rotation.y + rig.rotation.y;
          var avantX = -Math.sin(orientation);
          var avantZ = -Math.cos(orientation);
          var droiteX = Math.cos(orientation);
          var droiteZ = -Math.sin(orientation);
          var deplacementX = (avantX * -this.axeDeplacement.y + droiteX * this.axeDeplacement.x) * this.data.vitesseDeplacement * secondes;
          var deplacementZ = (avantZ * -this.axeDeplacement.y + droiteZ * this.axeDeplacement.x) * this.data.vitesseDeplacement * secondes;
          rig.position.x += deplacementX;
          rig.position.z += deplacementZ;
        }
      }
    });

    AFRAME.registerComponent('saisie-objet', {
      schema: {
        distanceSaisie: {default: 0.25}
      },
      init: function () {
        this.objetSaisi = null;
        this.positionMain = new THREE.Vector3();
        this.positionObjet = new THREE.Vector3();
        var contexte = this;
        this.el.addEventListener('gripdown', function () { contexte.attraper(); });
        this.el.addEventListener('gripup', function () { contexte.relacher(); });
      },
      attraper: function () {
        if (this.objetSaisi) { return; }
        var objetsSaisissables = document.querySelectorAll('.saisissable');
        this.el.object3D.getWorldPosition(this.positionMain);
        var distanceLaPlusProche = this.data.distanceSaisie;
        var objetLePlusProche = null;
        for (var index = 0; index < objetsSaisissables.length; index++) {
          var objet = objetsSaisissables[index];
          objet.object3D.getWorldPosition(this.positionObjet);
          var distance = this.positionMain.distanceTo(this.positionObjet);
          if (distance < distanceLaPlusProche) {
            distanceLaPlusProche = distance;
            objetLePlusProche = objet;
          }
        }
        if (objetLePlusProche) {
          objetLePlusProche.removeAttribute('dynamic-body');
          this.el.object3D.attach(objetLePlusProche.object3D);
          this.objetSaisi = objetLePlusProche;
        }
      },
      relacher: function () {
        if (!this.objetSaisi) { return; }
        this.el.sceneEl.object3D.attach(this.objetSaisi.object3D);
        this.objetSaisi.setAttribute('dynamic-body', 'mass: 1');
        this.objetSaisi = null;
      }
    });

    AFRAME.registerComponent('tir-arme', {
      schema: {
        vitesseProjectile: {default: 16},
        rayonProjectile: {default: 0.05}
      },
      init: function () {
        this.positionBouche = new THREE.Vector3();
        this.quaternionBouche = new THREE.Quaternion();
        var contexte = this;
        this.el.addEventListener('triggerdown', function () { contexte.tirer(); });
      },
      tirer: function () {
        var saisie = this.el.components['saisie-objet'];
        if (!saisie || !saisie.objetSaisi || !saisie.objetSaisi.classList.contains('arme')) { return; }
        var arme = saisie.objetSaisi;
        var bouche = arme.querySelector('.bouche');
        bouche.object3D.getWorldPosition(this.positionBouche);
        bouche.object3D.getWorldQuaternion(this.quaternionBouche);
        var direction = new THREE.Vector3(0, 0, -1).applyQuaternion(this.quaternionBouche).normalize();
        var scene = this.el.sceneEl;

        var projectile = document.createElement('a-sphere');
        projectile.classList.add('projectile');
        projectile.setAttribute('radius', this.data.rayonProjectile);
        projectile.setAttribute('color', '#FFD43B');
        projectile.setAttribute('position', {
          x: this.positionBouche.x + direction.x * 0.1,
          y: this.positionBouche.y + direction.y * 0.1,
          z: this.positionBouche.z + direction.z * 0.1
        });
        projectile.setAttribute('dynamic-body', 'shape: sphere; mass: 0.2');

        var vitesse = this.data.vitesseProjectile;
        projectile.addEventListener('body-loaded', function () {
          projectile.body.velocity.set(direction.x * vitesse, direction.y * vitesse, direction.z * vitesse);
        });

        projectile.addEventListener('collide', function (evenement) {
          var objetTouche = evenement.detail.body.el;
          if (objetTouche && objetTouche.classList.contains('cible')) {
            var positionImpact = objetTouche.getAttribute('position');
            jouerSonImpact(scene, positionImpact);
            creerParticules(scene, positionImpact);
            if (objetTouche.parentNode) { objetTouche.parentNode.removeChild(objetTouche); }
            if (projectile.parentNode) { projectile.parentNode.removeChild(projectile); }
          }
        });

        scene.appendChild(projectile);
      }
    });

    AFRAME.registerComponent('generateur-cibles', {
      schema: {
        delai: {default: 3000},
        hauteur: {default: 1.5},
        etendue: {default: 6}
      },
      init: function () {
        var contexte = this;
        this.minuterie = setInterval(function () { contexte.genererCible(); }, this.data.delai);
      },
      remove: function () {
        clearInterval(this.minuterie);
      },
      genererCible: function () {
        var positionX = (Math.random() - 0.5) * this.data.etendue;
        var positionZ = -2 - Math.random() * this.data.etendue;
        var estCube = Math.random() < 0.5;
        var cible = document.createElement(estCube ? 'a-box' : 'a-cone');
        cible.classList.add('cible');
        cible.setAttribute('position', {x: positionX, y: this.data.hauteur, z: positionZ});
        cible.setAttribute('color', estCube ? '#FA5252' : '#BE4BDB');
        cible.setAttribute('shadow', 'cast: true; receive: true');
        if (estCube) {
          cible.setAttribute('width', 0.4);
          cible.setAttribute('height', 0.4);
          cible.setAttribute('depth', 0.4);
          cible.setAttribute('static-body', 'shape: box');
        } else {
          cible.setAttribute('radius-bottom', 0.25);
          cible.setAttribute('radius-top', 0);
          cible.setAttribute('height', 0.5);
          cible.setAttribute('static-body', 'shape: box');
        }
        this.el.appendChild(cible);
      }
    });

    function jouerSonImpact(scene, position) {
      var sourceSon = document.createElement('a-entity');
      sourceSon.setAttribute('position', position);
      sourceSon.setAttribute('sound', 'src: #sonImpact; positional: true; distanceModel: linear; refDistance: 1; maxDistance: 25; rolloffFactor: 1; volume: 1');
      sourceSon.addEventListener('loaded', function () {
        sourceSon.components.sound.playSound();
      });
      scene.appendChild(sourceSon);
      setTimeout(function () {
        if (sourceSon.parentNode) { sourceSon.parentNode.removeChild(sourceSon); }
      }, 1000);
    }

    function creerParticules(scene, position) {
      var nombreParticules = 12;
      for (var index = 0; index < nombreParticules; index++) {
        var particule = document.createElement('a-sphere');
        particule.setAttribute('radius', 0.04);
        particule.setAttribute('color', '#FFA94D');
        particule.setAttribute('material', 'transparent: true; opacity: 1');
        particule.setAttribute('position', position);
        var destination = {
          x: position.x + (Math.random() - 0.5),
          y: position.y + (Math.random() - 0.5),
          z: position.z + (Math.random() - 0.5)
        };
        particule.setAttribute('animation__deplacement', 'property: position; to: ' + destination.x + ' ' + destination.y + ' ' + destination.z + '; dur: 600; easing: easeOutQuad');
        particule.setAttribute('animation__disparition', 'property: material.opacity; from: 1; to: 0; dur: 600; easing: easeOutQuad');
        scene.appendChild(particule);
        (function (particuleADetruire) {
          setTimeout(function () {
            if (particuleADetruire.parentNode) { particuleADetruire.parentNode.removeChild(particuleADetruire); }
          }, 650);
        })(particule);
      }
    }
  </script>
</head>
