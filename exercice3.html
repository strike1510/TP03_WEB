
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TP03 - Exercice 3 - Arme en VR</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>
    AFRAME.registerComponent('deplacement-joystick', {
      init: function () {
        this.gauche = document.querySelector('#mainGauche');
        this.droite = document.querySelector('#mainDroite');
        this.camera = document.querySelector('#camera');
        this.deplacement = {x: 0, y: 0};
        this.rotation = 0;

        this.gauche.addEventListener('thumbstickmoved', e => {
          this.deplacement.x = e.detail.x;
          this.deplacement.y = e.detail.y;
        });

        this.droite.addEventListener('thumbstickmoved', e => {
          this.rotation = e.detail.x;
        });
      },

      tick: function (t, dt) {
        let vitesse = dt / 1000;
        let angle = this.camera.object3D.rotation.y + this.el.object3D.rotation.y;

        this.el.object3D.rotation.y -= this.rotation * vitesse;

        this.el.object3D.position.x +=
          (-Math.sin(angle) * -this.deplacement.y +
           Math.cos(angle) * this.deplacement.x) * vitesse * 3;

        this.el.object3D.position.z +=
          (-Math.cos(angle) * -this.deplacement.y -
           Math.sin(angle) * this.deplacement.x) * vitesse * 3;
      }
    });


    AFRAME.registerComponent('saisie-objet', {
      init: function () {
        this.objet = null;

        this.el.addEventListener('gripdown', () => {
          let objets = document.querySelectorAll('.saisissable');
          let main = new THREE.Vector3();

          this.el.object3D.getWorldPosition(main);

          let distance = 0.3;

          objets.forEach(objet => {
            let position = new THREE.Vector3();
            objet.object3D.getWorldPosition(position);

            let d = main.distanceTo(position);

            if (d < distance) {
              distance = d;
              this.objet = objet;
            }
          });

          if (this.objet) {
            this.objet.removeAttribute('dynamic-body');
            this.el.object3D.attach(this.objet.object3D);
          }
        });

        this.el.addEventListener('gripup', () => {
          if (!this.objet) return;

          let objet = this.objet;

          this.el.sceneEl.object3D.attach(objet.object3D);
          objet.setAttribute('dynamic-body', 'mass: 1');

          this.objet = null;
        });
      }
    });



    AFRAME.registerComponent('tir-arme', {
      init: function () {
        this.el.addEventListener('triggerdown', () => {

          let saisie = this.el.components['saisie-objet'];

          if (!saisie || !saisie.objet) return;
          if (!saisie.objet.classList.contains('arme')) return;

          let arme = saisie.objet;
          let bouche = arme.querySelector('.bouche');

          let position = new THREE.Vector3();
          let quaternion = new THREE.Quaternion();

          bouche.object3D.getWorldPosition(position);
          bouche.object3D.getWorldQuaternion(quaternion);

          let direction = new THREE.Vector3(0, 0, -1)
            .applyQuaternion(quaternion)
            .normalize();

          let balle = document.createElement('a-sphere');

          balle.classList.add('projectile');

          balle.setAttribute('radius', '0.05');
          balle.setAttribute('color', '#FFD43B');

          balle.setAttribute('position', {
            x: position.x + direction.x * 0.2,
            y: position.y + direction.y * 0.2,
            z: position.z + direction.z * 0.2
          });

          balle.setAttribute(
            'dynamic-body',
            'shape: sphere; mass: 0.2'
          );

          this.el.sceneEl.appendChild(balle);

          balle.addEventListener('body-loaded', () => {
            balle.body.velocity.set(
              direction.x * 16,
              direction.y * 16,
              direction.z * 16
            );
          });
        });
      }
    });


  </script>
</head>

<body>

  <a-scene physics="gravity: -9.8">

    <a-entity
      light="type: directional; intensity: 0.8"
      position="5 8 3">
    </a-entity>

    <a-entity
      light="type: ambient; intensity: 0.5">
    </a-entity>

    <a-entity
      id="arme"
      class="saisissable arme"
      position="0.3 1.1 -1"
      dynamic-body="mass: 1">

      <a-box
        color="#343A40"
        width="0.07"
        height="0.12"
        depth="0.32">
      </a-box>

      <a-box
        color="#212529"
        position="0 -0.13 0.09"
        width="0.06"
        height="0.16"
        depth="0.1">
      </a-box>

      <a-entity
        class="bouche"
        position="0 0 -0.2">
      </a-entity>

    </a-entity>


    <a-plane
      rotation="-90 0 0"
      width="30"
      height="30"
      color="#7BC47F"
      static-body>
    </a-plane>


    <a-sky color="#AECBEB"></a-sky>


    <a-entity
      id="rig"
      deplacement-joystick>

      <a-entity
        id="camera"
        camera
        position="0 1.6 0"
        look-controls>
      </a-entity>

      <a-entity
        id="mainGauche"
        meta-touch-controls="hand: left"
        saisie-objet
        tir-arme>
      </a-entity>

      <a-entity
        id="mainDroite"
        meta-touch-controls="hand: right"
        saisie-objet
        tir-arme>
      </a-entity>

    </a-entity>

  </a-scene>

</body>
</html>
